name: Publish latest Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-windows-release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.policy.outputs.publish }}
      version: ${{ steps.policy.outputs.version }}
      tag: ${{ steps.policy.outputs.tag }}
      sha: ${{ steps.policy.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Test release policy
        run: node --test tests/release-tag.test.cjs tests/release-policy.test.cjs
      - name: Update release notes and check runtime changes
        id: policy
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const policy = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/release-policy.cjs`);
            const version = fs.readFileSync('VERSION', 'utf8').trim();
            if (!/^\d+\.\d+\.\d+$/.test(version)) throw new Error('VERSION must contain major.minor.patch');
            const tag = `v${version}`;
            const sha = policy.resolveCommit('HEAD');
            core.setOutput('publish', 'false');
            core.setOutput('version', version);
            core.setOutput('tag', tag);
            core.setOutput('sha', sha);
            const repoUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}`;
            const releases = await github.paginate(github.rest.repos.listReleases, { ...context.repo, per_page: 100 });
            // Maintain published posts without changing their tags or assets.
            await policy.refreshBodies(github, context.repo, releases, repoUrl);
            let latest;
            try {
              latest = (await github.rest.repos.getLatestRelease(context.repo)).data;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const base = latest ? policy.resolveCommit(`refs/tags/${latest.tag_name}`) : null;
            const changed = policy.runtimeChanges(base, sha);
            if (changed.length === 0) {
              await core.summary.addHeading('Release skipped').addRaw(`No runtime/build-input changes since ${latest.tag_name}. Existing notes refreshed; no EXE build, tag or new release.`).write();
              return;
            }
            if (releases.some(r => r.tag_name === tag)) {
              await core.summary.addHeading('Release skipped').addRaw(`${tag} already exists (including drafts). Bump the application version before publishing runtime changes.`).write();
              return;
            }
            const { assertTagTarget } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/release-tag.cjs`);
            await assertTagTarget(github, context.repo, tag, sha);
            const source = fs.readFileSync('ChunsikDesktopPet/Program.cs', 'utf8');
            for (const attribute of ['AssemblyVersion', 'AssemblyFileVersion']) {
              if (!source.includes(`${attribute}("${version}.0")`)) throw new Error(`${attribute} does not match VERSION`);
            }
            core.setOutput('publish', 'true');
            await core.summary.addHeading('Release planned').addList(changed).write();

  release:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
      - uses: microsoft/setup-msbuild@v2
      - name: Build Release x64
        run: msbuild ChunsikPet.sln /t:Rebuild /p:Configuration=Release /p:Platform=x64 /m
      - name: Build scheduling tests
        run: msbuild tests/ScheduleTests.csproj /t:Rebuild /m
      - name: Run scheduling tests
        run: .\tests\bin\ScheduleTests.exe
      - name: Build multi-monitor placement tests
        run: msbuild tests/NoticePlacementTests.csproj /t:Rebuild /m
      - name: Run multi-monitor placement tests
        run: .\tests\bin\NoticePlacementTests.exe
      - name: Build ghost note UI tests
        run: msbuild tests/GhostNoteTests.csproj /t:Rebuild /m
      - name: Run ghost note UI tests
        run: .\tests\bin\GhostNoteTests.exe
      - name: Build post-it settings tests
        run: msbuild tests/TodoSettingsTests.csproj /t:Rebuild /m
      - name: Run post-it settings tests
        run: .\tests\bin\TodoSettingsTests.exe
      - name: Tag, attach EXE and publish release
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
        with:
          script: |
            const fs = require('fs');
            const policy = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/release-policy.cjs`);
            const tag = process.env.RELEASE_TAG;
            const sha = process.env.RELEASE_SHA;
            const repoUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}`;
            const releases = await github.paginate(github.rest.repos.listReleases, { ...context.repo, per_page: 100 });
            if (releases.some(r => r.tag_name === tag)) {
              await core.summary.addHeading('Release skipped').addRaw(`${tag} already exists.`).write();
              return;
            }
            let latest;
            try {
              latest = (await github.rest.repos.getLatestRelease(context.repo)).data;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const base = latest ? policy.resolveCommit(`refs/tags/${latest.tag_name}`) : null;
            if (policy.runtimeChanges(base, sha).length === 0) {
              await core.summary.addHeading('Release skipped').addRaw('The latest release already includes all runtime changes.').write();
              return;
            }
            const { assertTagTarget } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/release-tag.cjs`);
            await assertTagTarget(github, context.repo, tag, sha);
            const exe = fs.readFileSync('ChunsikDesktopPet/bin/x64/Release/ChunsikPet.exe');
            if (exe.length < 2 || exe.toString('ascii', 0, 2) !== 'MZ') throw new Error('Built EXE is missing or invalid');
            const body = policy.releaseBody(repoUrl, latest, { tag_name: tag, sha });
            const { data: release } = await github.rest.repos.createRelease({
              ...context.repo, tag_name: tag, target_commitish: sha,
              name: `춘식이 데스크톱 펫 ${tag}`, body, draft: true, prerelease: false
            });
            await github.rest.repos.uploadReleaseAsset({
              ...context.repo, release_id: release.id, name: 'ChunsikPet.exe', data: exe,
              headers: { 'content-type': 'application/vnd.microsoft.portable-executable', 'content-length': exe.length }
            });
            const { data: published } = await github.rest.repos.updateRelease({
              ...context.repo, release_id: release.id, draft: false, make_latest: 'true'
            });
            await core.summary.addHeading(`Published ${tag}`).addLink('Download EXE / Release', published.html_url).write();
